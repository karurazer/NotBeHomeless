[project]
name = "notbehomeless"
version = "0.1.0"
description = "Async FastAPI service that finds and auto-reacts to Dutch student housing offers (Roomspot)."
authors = [
    {name = "karurazer",email = "karurazer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "playwright (>=1.58.0,<2.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "yarl (>=1.23.0,<2.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "fastapi[standard] (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "notbehomeless", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
